<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Media Zoom Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        <line x1="11" y1="8" x2="11" y2="14"></line>
        <line x1="8" y1="11" x2="14" y2="11"></line>
      </svg>
      <span>Media Zoom</span>
    </div>
    <div class="header-actions">
      <button id="openOptionsBtn" class="icon-btn" title="Open Settings" aria-label="Open Settings">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
      <button id="langToggle" class="lang-btn" title="Switch language">EN</button>
      <label class="switch">
        <input type="checkbox" id="toggleEnabled" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="content">
    <div class="setting-row">
      <label for="modifierKey" data-i18n="modifierLabel">Activation key:</label>
      <select id="modifierKey">
        <option value="ctrl" data-i18n="optCtrl">Ctrl / Cmd ⌘ (default)</option>
        <option value="alt" data-i18n="optAlt">Alt / Option ⌥</option>
        <option value="shift" data-i18n="optShift">Shift</option>
      </select>
    </div>

    <div class="setting-row">
      <div class="label-with-value">
        <label for="zoomSpeed" data-i18n="zoomSpeedLabel">Zoom speed:</label>
        <span id="zoomSpeedVal">35%</span>
      </div>
      <input type="range" id="zoomSpeed" min="1.05" max="4.00" step="0.01" value="1.35">
    </div>

    <button type="button" id="moreSettingsBtn" class="more-settings-btn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
      <span data-i18n="moreSettingsLabel">More Settings...</span>
    </button>

    <div class="tips">
      <div class="tip-title" data-i18n="controlsTitle">Controls (Windows / Mac):</div>
      <ul>
        <li data-i18n-html="tipZoom"><strong>Ctrl (or Cmd ⌘) + Wheel</strong> — zoom in/out (or 2-finger Pinch on Mac trackpad).</li>
        <li data-i18n-html="tipWheelPan"><strong>Normal Wheel</strong> (when zoomed) — smoothly pan up/down.</li>
        <li data-i18n-html="tipShiftPan"><strong>Shift + Wheel</strong> — pan left/right.</li>
        <li data-i18n-html="tipDrag"><strong>Left-click Drag</strong> — free pan anywhere.</li>
        <li data-i18n-html="tipReset"><strong>Double-click / Esc</strong> — reset zoom to 100%.</li>
      </ul>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
