<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Тестова сторінка Media Zoom</title>
  <style>
    body {
      font-family: sans-serif;
      background: #111827;
      color: #f9fafb;
      margin: 0;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }
    h1 { margin-bottom: 5px; }
    p { color: #9ca3af; margin: 0; text-align: center; }

    .gallery-container {
      width: 600px;
      overflow: hidden;
      border-radius: 12px;
      background: #1f2937;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      position: relative;
    }

    /* Simulates website slider / swiper */
    .slider {
      display: flex;
      transition: transform 0.4s ease;
      width: 300%;
    }

    .slide {
      width: 600px;
      height: 400px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .slide img {
      max-width: 100%;
      max-height: 100%;
      object-fit: cover;
      border-radius: 8px;
    }

    .slide video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
    }

    /* Simulates transparent overlay on top of video/image */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: auto;
      background: rgba(0,0,0,0.05);
    }

    .badge-info {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(0,0,0,0.6);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      color: #e5e7eb;
      pointer-events: none;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.6);
      color: white;
      border: none;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 18px;
      border-radius: 50%;
      z-index: 10;
    }
    .prev { left: 10px; }
    .next { right: 10px; }
  </style>
</head>
<body>
  <h1>Тест зуму медіа (Ctrl + Wheel)</h1>
  <p>За звичайних умов колесико миші тут гортає слайди галереї.<br>З розширенням <strong>Ctrl + Колесико</strong> буде приближувати зображення чи відео під курсором без перемикання слайду!</p>

  <div class="gallery-container" id="carousel">
    <button class="nav-btn prev" id="prevBtn">&#10094;</button>
    <button class="nav-btn next" id="nextBtn">&#10095;</button>

    <div class="slider" id="slider">
      <div class="slide">
        <img src="https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?w=800&auto=format&fit=crop" alt="Demo Painting">
        <div class="overlay"></div>
        <div class="badge-info">Слайд 1: Фото з оверлеєм</div>
      </div>
      <div class="slide">
        <video controls autoplay muted loop src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4"></video>
        <div class="badge-info">Слайд 2: Відео HTML5</div>
      </div>
      <div class="slide">
        <img src="https://images.unsplash.com/photo-1541701494587-cb58502866ab?w=800&auto=format&fit=crop" alt="Demo Abstract">
        <div class="badge-info">Слайд 3: Фото абстракція</div>
      </div>
    </div>
  </div>

  <script>
    // Site-native slider behavior that switches slides on wheel event
    let currentSlide = 0;
    const totalSlides = 3;
    const slider = document.getElementById('slider');

    function goToSlide(index) {
      if (index < 0) index = 0;
      if (index >= totalSlides) index = totalSlides - 1;
      currentSlide = index;
      slider.style.transform = `translateX(-${currentSlide * 600}px)`;
    }

    document.getElementById('prevBtn').onclick = () => goToSlide(currentSlide - 1);
    document.getElementById('nextBtn').onclick = () => goToSlide(currentSlide + 1);

    // Site's own wheel handler that flips slides:
    document.getElementById('carousel').addEventListener('wheel', (e) => {
      // If Ctrl is held and not intercepted, website would also switch slides:
      if (e.deltaY > 0) {
        goToSlide(currentSlide + 1);
      } else if (e.deltaY < 0) {
        goToSlide(currentSlide - 1);
      }
    });
  </script>
</body>
</html>
